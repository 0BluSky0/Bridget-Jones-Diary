<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridget Jones Diary</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <script src="index.js" defer></script>
</head>
<body>
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <h1 class="mb-4 text-center">My Diary Entry</h1>
          <form id="entryForm">
            <div class="mb-3">
              <label for="date" class="form-label">Date</label>
              <input type="date" id="date" class="form-control" required>
            </div>
 
            <div class="mb-3">
              <label for="time" class="form-label">Time</label>
              <input type="time" id="time" class="form-control">
            </div>
 
            <div class="mb-3">
              <label for="category" class="form-label">Category</label>
              <select id="category" class="form-select">
                <option value="">Choose one</option>
                <option value="Daily Life">Daily Life</option>
                <option value="Dreams">Dreams</option>
                <option value="Gossip">Gossip</option>
              </select>
            </div>
 
            <div class="mb-3">
              <label for="text" class="form-label">Entry</label>
              <textarea id="text" class="form-control" rows="6" required></textarea>
            </div>
 
            <button type="submit" class="btn btn-primary w-100">Save</button>
          </form>
 
          <div id="successMsg" class="alert alert-success mt-3" role="alert" style="display: none;"></div>
          <div id="errorMsg" class="alert alert-danger mt-3" role="alert" style="display: none;"></div>
        </div>
      </div>
    </div>
  </body>
</html>
